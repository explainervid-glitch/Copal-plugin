<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Copal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">

        <!-- Where the palettes are kept, and the two ways to add to them.
             Icons only; each says what it does when hovered. -->
        <div class="bar">
            <div id="scope" class="scope">
                <button class="icon scope-btn" type="button" data-scope="project" aria-label="This project">
                    <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
                </button>
                <button class="icon scope-btn" type="button" data-scope="user" aria-label="All projects">
                    <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/><path d="m2 17.5 10 5 10-5"/></svg>
                </button>
            </div>
            <div class="actions">
                <button id="replace" class="icon" type="button" aria-label="Replace a colour"
                        title="Replace one colour with another: shapes, text, solids and effects">
                    <svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
                </button>
                <button id="from-picture" class="icon" type="button" aria-label="Colours from a picture"
                        title="Colours from a picture. Or drop a picture or an .ase file on the panel, or press Ctrl+V with a picture, a Coolors link or hex codes copied">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
                </button>
                <button id="save" class="icon is-primary" type="button" aria-label="Save"
                        title="Save the fill and stroke of the selected shape layer">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </div>
        </div>

        <!-- One colour into another, across layers. Clicking a palette
             fills in the field that was last used. -->
        <div id="swap" class="swap hidden">
            <label class="swap-field" title="The colour to find. Type a hex code, or click a palette">
                <span id="swap-from-chip" class="swap-chip"></span>
                <input id="swap-from" type="text" maxlength="7" spellcheck="false" placeholder="From" aria-label="Colour to find">
            </label>
            <svg class="swap-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></svg>
            <label class="swap-field" title="The colour to put in its place. Type a hex code, or click a palette">
                <span id="swap-to-chip" class="swap-chip"></span>
                <input id="swap-to" type="text" maxlength="7" spellcheck="false" placeholder="To" aria-label="Colour to put in its place">
            </label>
            <select id="swap-where" class="swap-where" aria-label="Where to replace" title="Where to replace">
                <option value="selection">Selected layers</option>
                <option value="comp">This comp</option>
                <option value="project">Whole project</option>
            </select>
            <div class="tray-actions">
                <button id="swap-go" class="icon is-primary" type="button" aria-label="Replace">
                    <svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg>
                </button>
                <button id="swap-cancel" class="icon" type="button" aria-label="Close" title="Close">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>
        </div>

        <!-- The main colours of a dropped picture, or colours from an .ase
             file or a pasted Coolors link, until they are saved. -->
        <div id="tray" class="tray hidden">
            <div id="tray-chips" class="tray-chips" role="listbox" aria-multiselectable="true"
                 aria-label="Colours waiting to be saved"></div>
            <div class="tray-actions">
                <button id="tray-save" class="icon is-primary" type="button" aria-label="Save colours">
                    <svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg>
                </button>
                <button id="tray-cancel" class="icon" type="button" aria-label="Cancel" title="Close without saving">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>
        </div>
        <input id="picker" class="hidden" type="file" accept="image/*">
        <input id="ase-picker" class="hidden" type="file" accept=".ase">

        <!-- The inventory. Double click a palette to apply it. -->
        <div id="grid" class="grid" role="listbox" aria-label="Saved palettes"></div>
        <div id="empty" class="empty hidden"></div>

        <!-- One line: the selected palette, or what just happened. -->
        <div id="foot" class="foot">
            <span id="name" class="name" title="Double click to rename"></span>
            <input id="rename" class="rename hidden" type="text" maxlength="60"
                   spellcheck="false" aria-label="Palette name">
            <span id="detail" class="detail"></span>
            <span id="status" class="status"></span>
            <button id="undo" class="undo hidden" type="button">Undo</button>
        </div>

        <div id="menu" class="menu hidden" role="menu">
            <button type="button" role="menuitem" data-action="apply" data-needs="palette">Apply</button>
            <button type="button" role="menuitem" data-action="replace" data-needs="palette">Replace with selection</button>
            <button type="button" role="menuitem" data-action="rename" data-needs="palette">Rename</button>
            <button type="button" role="menuitem" data-action="delete" data-needs="palette">Delete</button>
            <div class="menu-rule" data-needs="palette"></div>
            <button type="button" role="menuitem" data-action="picture">Colours from a picture&hellip;</button>
            <button type="button" role="menuitem" data-action="paste">Paste picture or colours</button>
            <button type="button" role="menuitem" data-action="ase-in">Import swatches (.ase)&hellip;</button>
            <button type="button" role="menuitem" data-action="ase-out">Export swatches (.ase)&hellip;</button>
            <button type="button" role="menuitem" data-action="reveal">Show palette file</button>
        </div>

    </div>

    <script src="js/CSInterface.js"></script>
    <!-- zeploy usage helper: an unchanged copy of zeploy's examples/usage/zeploy-usage.js -->
    <script src="js/zeploy-usage.js"></script>
    <script src="js/store.js"></script>
    <script src="js/gradient.js"></script>
    <script src="js/picture.js"></script>
    <script src="js/swatches.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
